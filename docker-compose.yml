---
services:
  in-app-dynamic-reporting:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        REACT_APP_BASE_URL: "http://192.168.112.28"
    ports:
      - "1000:80"
    volumes:
      - ./nginx/default_local.conf:/etc/nginx/conf.d/default.conf:ro
      - ./config.js_template:/usr/share/nginx/html/apps/config.js:ro
