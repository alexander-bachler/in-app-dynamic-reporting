---
apiVersion: v1
kind: Service
metadata:
  name: '{{.Values.appName | default "linemetrics"}}'
  namespace: '{{.Values.appNamespace | default "linemetrics"}}'
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      name: "node-30280"
      nodePort: 30280
  selector:
    app: '{{.Values.appName | default "linemetrics"}}'
