---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app-network-policy
  namespace: "{{ .Values.appNamespace | default "linemetrics" }}"
spec:
  policyTypes:
    - Ingress
    - Egress

  podSelector:
    matchLabels: {}

  ingress:
    {{ if .Values.ingress }}
    {{- range $rule := index .Values "ingress" "cidr" }}
    - from:
        - ipBlock:
            cidr: {{ index $rule.host }}
      ports:
        - port: {{ index $rule.port }}
    {{- end }}

    {{- range $rule := index .Values "ingress" "pods" }}
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ index $rule.namespace }}
          podSelector:
            matchLabels:
              {{- range $k, $v := $rule.labels }}
              {{- range $kk, $vv := $v }}
              {{ $kk }}: {{ $vv }}
              {{- end }}
              {{- end }}
      ports:
        - port: {{ index $rule.port }}
          protocol: {{ index $rule.protocol }}
    {{- end }}

    {{ else }}
    - {}
    {{ end }}

  egress:
    {{- range $rule := index .Values "egress" "pods" }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ index $rule.namespace }}
          podSelector:
            matchLabels:
              {{- range $k, $v := $rule.labels }}
              {{- range $kk, $vv := $v }}
              {{ $kk }}: {{ $vv }}
              {{- end }}
              {{- end }}
      ports:
        - port: {{ index $rule.port }}
          protocol: {{ index $rule.protocol }}
    {{- end }}

    {{- range $rule := index .Values "egress" "cidr" }}
    - to:
        - ipBlock:
            cidr: {{ index $rule.host }}
      {{ if $rule.port }}
      ports:
        - port: {{ index $rule.port }}
      {{ end }}
    {{- end }}

    - to:
        - podSelector: {}
